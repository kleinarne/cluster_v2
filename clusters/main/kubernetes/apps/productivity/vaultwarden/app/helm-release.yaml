---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  interval: 15m
  chart:
    spec:
      chart: vaultwarden
      version: 30.0.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Berlin
    global:
      stopAll: false
    vaultwarden:
      allowSignups: false
      smtp:
        enabled: true
        host: ${SMTP_SERVER}
        from: ${SMTP_SENDER_EMAIL}
        fromName: ${SMTP_SENDER_NAME}
        security: force_tls
        port: 587
        authMechanism: Login
        heloName: ""
        timeout: 15
        invalidHostname: true
        invalidCertificate: true
        user: ${SMTP_USERNAME}
        password: ${SMTP_PASSWORD}
      push:
        enabled: true
        installationId: ${VAULTWARDEN_PUSHID}
        installationKey: ${VAULTWARDEN_PUSHKEY}
    cnpg:
      main:
        mode: recovery
        password: ${VAULTWARDEN_CNPG_PASSWORD}
        backups:
          enabled: true
          credentials: garage
          scheduledBackups:
            - name: daily-backup
              schedule: "0 25 0 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
        recovery:
          enabled: true
          credentials: garage
    persistence:
      data:
        volsync:
          - name: backup
            type: restic
            credentials: garage
            dest:
              enabled: true
            src:
              enabled: true
              trigger:
                schedule: 27 0 * * *
    ingress:
      main:
        enabled: true
        ingressClassName: external
        hosts:
          - host: vaultwarden.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
          - host: vw.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          traefik:
            enabled: false
          nginx:
            enabled: true
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true
    credentials:
      minio:
        type: s3
        url: ${MINIO_S3_URL}
        bucket: ${MINIO_S3_CLUSTERV3_BUCKET}-vaultwarden
        accessKey: ${MINIO_S3_ACCESSKEY}
        secretKey: ${MINIO_S3_SECRETKEY}
        encrKey: ${MINIO_S3_ENCRKEY}
      garage:
        type: s3
        url: ${GARAGE_S3_URL}
        bucket: ${GARAGE_S3_BUCKET}
        accessKey: ${GARAGE_S3_ACCESSKEY}
        secretKey: ${GARAGE_S3_SECRETKEY}
        encrKey: ${GARAGE_S3_ENCRYPTIONKEY}
