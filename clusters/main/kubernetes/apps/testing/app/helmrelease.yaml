---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: office
spec:
  interval: 15m
  chart:
    spec:
      chart: nextcloud
      version: 46.0.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Berlin
    global:
      stopAll: true
    nextcloud:
      credentials:
        initialAdminUser: test-ncadmin
        initialAdminPassword: test-ncpassword
      general:
        accessIP: ${NGINX_INTERNAL_IP}
      collabora:
        enabled: true
        username: test-coadmin
        password: test-ocpassword
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: office.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true