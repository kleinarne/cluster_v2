---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: media
spec:
  interval: 15m
  chart:
    spec:
      chart: jellyfin
      version: 21.12.9
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    autodiscovery:
      enabled: true
    TZ: Europe/Berlin
    global:
      stopAll: false
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            JELLYFIN_DATA_DIR: /data
            JELLYFIN_CONFIG_DIR: /config
            JELLYFIN_LOG_DIR: /logs
            JELLYFIN_CACHE_DIR: /cache
    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: minio
            dest:
              enabled: true
            src:
              enabled: true
              trigger:
                schedule: 5 0 * * *
      media:
        enabled: true
        existingClaim: media-nfs-pvc
        mountPath: /mnt/media
      data:
        enabled: true
        mountPath: /config/
      logs:
        enabled: true
        mountPath: /logs
        type: emptyDir
    service:
      main:
        type: LoadBalancer
        loadBalancerIP: ${JELLYFIN_IP}
        integrations:
          metallb:
            enabled: true
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: jellyfin.${DOMAIN_0}
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true
    credentials:
      minio:
        type: s3
        url: ${MINIO_S3_URL}
        bucket: ${MINIO_S3_CLUSTERV3_BUCKET}-jellyfin
        accessKey: ${MINIO_S3_ACCESSKEY}
        secretKey: ${MINIO_S3_SECRETKEY}
        encrKey: ${MINIO_S3_ENCRKEY}


